spring:
  application:
    name: Software Development Document Environment
  profiles:
    active: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: 8080

app:
  title: Software Development Document Environment
  code: SDM
  auth-mode: LOCAL # Options: LOCAL, LDAP
  ldap:
    url: ldap://localhost:389
    base-dn: dc=cth,dc=com
    user-dn-pattern: uid={0},ou=people
  notifications:
    email-enabled: false
    sms-enabled: false
  ingestion:
    watch-folder: ./auto_ingest
    poll-interval-ms: 5000
  rag:
    service-url: http://localhost:5000
    model-chat: llama3.2:latest
    model-embed: nomic-embed-text

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:sdmdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sdmdb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521:XE}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${SPRING_DATASOURCE_USERNAME:sdm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sdm_password}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect

---
spring:
  config:
    activate:
      on-profile: sqlserver
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=sdmdb;encrypt=false}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:StrongPass123!}
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
