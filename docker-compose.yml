version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: sdm-postgres
    environment:
      POSTGRES_DB: sdmdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"

  ollama:
    image: ollama/ollama:latest
    container_name: sdm-ollama
    ports:
      - "11434:11434"

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: sdm-rag-service
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL_CHAT=llama3.2:latest
      - MODEL_EMBED=nomic-embed-text
    ports:
      - "5000:5000"
    depends_on:
      - ollama

  sdm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdm-app
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sdmdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rag-service
